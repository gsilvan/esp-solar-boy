# Default telemetry mappings. Register addresses are the wire addresses (no offset).
# Fixed unit is used only when unit_mode = "fixed". Scale converts to percent or watts.
id = "sun2000-emma"
name = "Huawei SUN2000 + EMMA built-in meter"
default_unit = 2
requires_overrides = false

[soc]
register = 37004
unit_mode = "inverter"
unit = 2
type = "u16"
word_order = "high"
scale = 0.1
invert = false
ignore_no_data = false

[battery]
register = 37001
unit_mode = "inverter"
unit = 2
type = "i32"
word_order = "high"
scale = 1
invert = false
ignore_no_data = false

[plant]
register = 32064
unit_mode = "inverter"
unit = 2
type = "i32"
word_order = "high"
scale = 1
invert = false
ignore_no_data = false

[grid]
register = 31657
unit_mode = "fixed"
unit = 0
type = "i32"
word_order = "high"
scale = 1
invert = true
ignore_no_data = false
